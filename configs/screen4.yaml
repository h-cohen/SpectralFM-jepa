# Screen 4: continued pretraining of screen-2 global_mask75 with a sample-level (global-view) LeJEPA term
name: screen-4
output_dir: outputs/screen-4
eval_config: configs/eval_small4.yaml
eval_set: labeled_data         # the set the screen table scores
shared_overrides:
  - data.source=packed
  - data.packed_dir=/mnt5/home/hadar/nova/data/spectra_all
  - data.normalization=global
  - data.num_workers=12
  - masking.mask_ratio=0.75
  - training.init_checkpoint=/mnt5/home/hadar/nova/SpectralFM-jepa/outputs/screen-2/global_mask75_20261006-060636/checkpoint_last.pt
  - training.max_steps=15000
  - training.learning_rate=2.5e-4
  - training.warmup_epochs=0.02
  - training.val_every=2500
  - training.diag_every=2500
  - training.ckpt_every=15000
  - experiment.output_dir=outputs/screen-4
  - wandb.group=screen-4
  - "wandb.tags=[lejepa,spectralfm,1d,screen4,alldata]"
arms:
  cont_g1: [training.global_weight=1.0]
  cont_g025: [training.global_weight=0.25]
  cont_g1_v4: [training.global_weight=1.0, training.global_views=4, training.global_keep=0.25]
wandb:
  enabled: true
  entity: null
  project: spectralfm-lejepa
  group: screen-4
  tags: [lejepa, spectralfm, 1d, screen4, alldata]
