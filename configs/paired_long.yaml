# Fresh, controlled 24-vs-48-patch full-schedule comparison. Vary only patches and seed.
experiment:
  name: paired_long
  seed: 0
  output_dir: outputs/paired-long

data:
  source: packed
  packed_dir: /mnt5/home/hadar/nova/data/spectra_all
  normalization: global
  manifest_dir: /mnt5/noy/SpectralFM/fairseq/data/nova_data/single_channel_one
  sequence_length: 245
  max_train_samples: null
  num_workers: 4
  source_weights:
    labeled_regression: 0.5
    default: 0.5

model:
  num_patches: 24
  dim: 256
  depth: 6
  heads: 8
  mlp_dim: 1024
  dropout: 0.0
  predictor_dim: 192
  predictor_depth: 4
  predictor_heads: 6
  predictor_mlp_dim: 768
  projector: none
  projector_hidden_dim: 1024
  projector_dim: 128

masking:
  strategy: random
  mask_ratio: 0.75
  num_blocks: 3

training:
  batch_size: 256
  epochs: 10
  max_steps: null
  optimizer: adamw
  learning_rate: 0.0005
  weight_decay: 0.05
  warmup_epochs: 1.0
  final_lr_ratio: 0.001
  lambda_sigreg: 0.05
  sigreg_num_slices: 1024
  sigreg_knots: 17
  sigreg_t_max: 3.0
  regularizer: sigreg
  visreg_slices: 4096
  visreg_lambda: 0.6
  global_weight: 1.0
  global_views: 2
  global_keep: 0.5
  amp: true
  grad_clip: null
  log_every: 50
  val_every: 25000
  diag_every: 25000
  ckpt_every: 10000
  device: cuda
  resume: null
  init_checkpoint: null

wandb:
  enabled: true
  log_checkpoints: false
  entity: null
  project: spectralfm-lejepa
  group: paired-long-confirmatory
  job_type: pretrain
  tags: [lejepa, spectralfm, 1d, paired-long, confirmatory, alldata]
