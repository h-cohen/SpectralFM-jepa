# Multichannel measured stage 1: the budget_m (bm100) recipe on one [8, 245] input per measured sample,
# channels [comp0, comp1, N1, C1, S1, N2, C2, S2] (ops/build_multichannel.py; NaN = absent channel), each
# channel normalized by its own global mean / std; channel groups dropped with p = channel_drop in training.
experiment:
  name: mc_s107
  seed: 107
  output_dir: outputs/multichannel
data:
  source: multichannel
  multichannel_dir: /mnt5/home/hadar/nova/data/multichannel_measured
  normalization: channel_global   # per-channel (x - mean_c) / std_c from stats.json
  sequence_length: 245
  max_train_samples: null
  num_workers: 4
  channel_drop: 0.25            # each present group (comp0, comp1, triplet 1, triplet 2) dropped w.p. .25
model:
  in_channels: 8
  num_patches: 48
  dim: 256
  depth: 6
  heads: 8
  mlp_dim: 1024
  dropout: 0.0
  predictor_dim: 192
  predictor_depth: 4
  predictor_heads: 6
  predictor_mlp_dim: 768
masking:
  strategy: random
  mask_ratio: 0.75
  num_blocks: 3
training:
  batch_size: 256
  epochs: 10
  max_steps: 248995            # all-data members' measured exposure: .5 x 497,990 steps
  optimizer: adamw
  learning_rate: 0.0005
  weight_decay: 0.05
  warmup_epochs: 1.0
  warmup_steps: 49799          # same warmup in steps as the all-data recipe (uncapped)
  final_lr_ratio: 0.001
  lambda_sigreg: 0.05
  sigreg_num_slices: 1024
  sigreg_knots: 17
  sigreg_t_max: 3.0
  global_weight: 1.0
  global_views: 2
  global_keep: 0.5
  amp: true
  grad_clip: null
  log_every: 50
  val_every: 2735
  diag_every: 25000
  ckpt_every: 10000
  device: cuda
  resume: null
  schedule: cosine             # cosine (warmup + decay) or constant (LR held at learning_rate, no warmup)
  stop_step: null              # stop early at this step; the LR schedule keeps the full max_steps length
  preserve: null               # {weight, block}: pull block-k tokens toward the frozen init_checkpoint model
  save_steps: []               # extra checkpoint_step<N>.pt at these steps (0 = the init weights)
  init_checkpoint: null
  early_stopping: null
wandb:
  enabled: true
  log_checkpoints: false
  entity: null
  project: spectralfm-lejepa
  group: multichannel
  job_type: pretrain
  tags:
  - lejepa
  - spectralfm
  - multichannel
