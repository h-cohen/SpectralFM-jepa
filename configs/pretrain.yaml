# LeJEPA baseline pretraining. Every value here is logged to W&B.
# Floats need a decimal point (5.0e-4): PyYAML reads 5e-4 as a string.
experiment:
  name: lejepa_baseline
  seed: 0
  output_dir: outputs

data:
  source: manifests            # manifests | packed
  packed_dir: null             # directory with spectra.npy, stats.json, drop_rows.npy, valid_rows.npy
  normalization: sample_zscore # sample_zscore | global (global needs source=packed)
  # fairseq manifests (train.tsv / valid.tsv); /storage/noy roots are remapped to /mnt5/noy
  manifest_dir: /mnt5/noy/SpectralFM/fairseq/data/nova_data/single_channel_one
  sequence_length: 245
  max_train_samples: null      # null = all 999,000; set an int for dev runs
  num_workers: 8
  source_weights: null         # packed only: {prefix: mass, default: mass} reweights sources, e.g. {labeled_regression: 0.5, default: 0.5}

model:
  num_patches: 24
  dim: 256
  depth: 6
  heads: 8
  mlp_dim: 1024
  dropout: 0.0
  predictor_dim: 192
  predictor_depth: 4
  predictor_heads: 6
  predictor_mlp_dim: 768
  projector: none              # none | mlp (lightly LeJEPAProjectionHead)
  projector_hidden_dim: 1024
  projector_dim: 128

masking:
  strategy: random   # random | block
  mask_ratio: 0.5
  num_blocks: 3      # used only by strategy: block

training:
  batch_size: 256
  epochs: 20
  max_steps: null              # overrides epochs when set
  optimizer: adamw
  learning_rate: 5.0e-4
  weight_decay: 0.05
  warmup_epochs: 1.0
  final_lr_ratio: 0.001        # cosine decays to learning_rate * final_lr_ratio
  lambda_sigreg: 0.05
  sigreg_num_slices: 1024
  sigreg_knots: 17
  sigreg_t_max: 3.0
  global_weight: 0.0           # beta of the sample-level (pooled multi-view) term; 0 disables it (no extra compute)
  global_views: 2             # extra random-subset views per sample
  global_keep: 0.5            # fraction of the 24 patches each extra view keeps (random, per sample)
  amp: true                    # fp16 autocast (RTX 2080 Ti has no bf16)
  grad_clip: null
  log_every: 50
  val_every: 1000
  diag_every: 1000
  ckpt_every: 5000
  device: cuda
  init_checkpoint: null        # path: continue pretraining from these weights (same model and normalization; fresh optimizer)

wandb:
  enabled: true
  log_checkpoints: false   # checkpoints stay local; W&B gets metrics and figures only
  entity: null
  project: spectralfm-lejepa
  group: null
  job_type: pretrain
  tags: [lejepa, spectralfm, 1d, baseline]
