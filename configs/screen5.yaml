# Screen 5: SIGReg -> VISReg. Scratch arms repeat screen-2 global_mask75 exactly (pair: that run);
# visreg_cont repeats screen-3 cont_natural (pair: that run).
name: screen-5
output_dir: outputs/screen-5
eval_config: configs/eval_small5.yaml
eval_set: labeled_data         # the set the screen table scores
shared_overrides:
  - data.source=packed
  - data.packed_dir=/mnt5/home/hadar/nova/data/spectra_all
  - data.normalization=global
  - data.num_workers=12
  - masking.mask_ratio=0.75
  - training.init_checkpoint=/mnt5/home/hadar/nova/SpectralFM-jepa/outputs/screen-2/global_mask75_20261006-060636/checkpoint_last.pt
  - training.max_steps=15000
  - training.learning_rate=2.5e-4
  - training.warmup_epochs=0.02
  - training.val_every=2500
  - training.diag_every=2500
  - training.ckpt_every=15000
  - experiment.output_dir=outputs/screen-5
  - wandb.group=screen-5
  - "wandb.tags=[lejepa,spectralfm,1d,screen5,alldata]"
arms:
  visreg_scratch: [training.init_checkpoint=null, training.max_steps=null, training.epochs=1, training.learning_rate=5.0e-4, training.warmup_epochs=1.0, training.val_every=5000, training.diag_every=5000, training.ckpt_every=20000, training.regularizer=visreg]
  visreg_scratch_l09: [training.init_checkpoint=null, training.max_steps=null, training.epochs=1, training.learning_rate=5.0e-4, training.warmup_epochs=1.0, training.val_every=5000, training.diag_every=5000, training.ckpt_every=20000, training.regularizer=visreg, training.visreg_lambda=0.9]
  visreg_cont: [training.regularizer=visreg]
wandb:
  enabled: true
  entity: null
  project: spectralfm-lejepa
  group: screen-5
  tags: [lejepa, spectralfm, 1d, screen5, alldata]
