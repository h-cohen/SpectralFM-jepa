# Evaluate only block2 flat. No layer/readout search or checkpoint selection.
experiment:
  name: production_fixed_block2_eval
  seed: 42
  output_dir: outputs/final-model/eval
evaluation:
  device: cuda
  batch_size: 64
  max_samples: 5000
  n_jobs: 8
  backend: torch
  probe_device: cuda
  probe_workers: 1
  min_n: 20
  readouts:
  - flat
  flat_blocks:
  - 2
  random_control: true
  ladder_sets: []
  ladder_block_from: labeled_data
